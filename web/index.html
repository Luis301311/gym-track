<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo reemplaza el valor de --base-href al compilar. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registra tus entrenamientos y sigue tu progreso en el gym.">
  <meta name="theme-color" content="#0E0F12">

  <!-- iPhone: pantalla completa al abrir desde la pantalla de inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>GymTrack</title>

  <style>
    /* Fondo oscuro desde el primer instante: sin destello blanco al abrir. */
    html, body { margin: 0; height: 100%; background: #0E0F12; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      transition: opacity .25s ease;
    }
    #splash img { width: 88px; height: 88px; }
    #splash .bar {
      width: 64px; height: 4px; border-radius: 2px; overflow: hidden;
      background: #23262F; position: relative;
    }
    #splash .bar::after {
      content: ""; position: absolute; inset: 0; width: 40%;
      background: #C6F432; border-radius: 2px;
      animation: load 1s ease-in-out infinite;
    }
    @keyframes load { from { left: -40%; } to { left: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Cargando GymTrack">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>

  <script>
    // Quita la pantalla de carga cuando Flutter pinta el primer cuadro.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });

    // Service worker propio: permite abrir la app sin señal (ver gymtrack_sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('gymtrack_sw.js');
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
